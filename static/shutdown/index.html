<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Powering Off</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

  html, body {
    height: 100%;
    width: 100%;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
  }

  #screen {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(60,80,110,0.9), transparent 60%),
      radial-gradient(ellipse at 80% 30%, rgba(40,60,50,0.7), transparent 55%),
      linear-gradient(180deg, #1c2b3a 0%, #10151d 55%, #05070a 100%);
    filter: blur(0px);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 12vh;
    transition: opacity 0.9s ease;
  }

  #screen::before{
    content:"";
    position:absolute;
    inset:0;
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    background: rgba(0,0,0,0.15);
  }

  .row {
    position: relative;
    width: 78%;
    max-width: 320px;
    height: 58px;
    border-radius: 29px;
    display: flex;
    align-items: center;
    overflow: hidden;
    margin-bottom: 20px;
    z-index: 1;
  }

  #power-row {
    background: linear-gradient(180deg, #6fb6f5 0%, #4a9be8 100%);
    margin-bottom: 10px;
  }

  #power-label {
    position: absolute;
    width: 100%;
    text-align: center;
    color: #0b2e52;
    font-size: 19px;
    font-weight: 500;
    letter-spacing: 0.2px;
    pointer-events: none;
    z-index: 1;
    background: linear-gradient(
      100deg,
      rgba(11,46,82,0.55) 30%,
      rgba(11,46,82,1) 50%,
      rgba(11,46,82,0.55) 70%
    );
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 2.6s linear infinite;
  }

  @keyframes shine {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  #knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    touch-action: none;
    cursor: grab;
  }

  #knob svg {
    width: 22px;
    height: 22px;
  }

  #findable {
    color: rgba(255,255,255,0.65);
    font-size: 14px;
    margin-bottom: 55px;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 1;
  }
  #findable svg { width: 14px; height: 14px; }
  #findable .chev { width: 8px; height: 8px; margin-left: 2px; opacity: 0.7; }

  .gray-row {
    background: rgba(120,120,128,0.32);
  }
  .gray-row .icon-circle {
    background: #ffffff;
    color: #ff453a;
  }
  .gray-row .row-text {
    color: rgba(255,255,255,0.9);
  }

  .icon-circle {
    position: absolute;
    left: 3px;
    top: 3px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }

  .row-text {
    width: 100%;
    text-align: center;
    font-size: 19px;
    font-weight: 500;
    z-index: 1;
  }

  #sos-row .icon-circle {
    background: #ff453a;
    color: white;
    font-size: 13px;
    font-weight: 700;
  }

  #cancel {
    margin-top: 55px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    z-index: 1;
  }
  #cancel-btn {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: rgba(120,120,128,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #cancel-btn svg { width: 26px; height: 26px; }
  #cancel-text {
    color: white;
    font-size: 17px;
  }

  #blackout {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
    z-index: 10;
  }
</style>
</head>
<body>

<div id="screen">
  <div id="power-row" class="row">
    <div id="power-label">slide to power off</div>
    <div id="knob">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ff453a" stroke-width="1.8">
        <path d="M12 3v8" stroke-linecap="round"/>
        <path d="M7 5.5a8 8 0 1 0 10 0" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <div id="findable">
    <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="1.6">
      <path d="M4 9c4-4 12-4 16 0" stroke-linecap="round"/>
      <path d="M7 12.5c2.5-2.2 7.5-2.2 10 0" stroke-linecap="round"/>
      <path d="M10.2 16c1-0.8 2.6-0.8 3.6 0" stroke-linecap="round"/>
    </svg>
    iPhone Findable After Power Off
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2.5">
      <path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="row gray-row">
    <div class="row-text">Medical ID</div>
    <div class="icon-circle" style="font-size:26px; font-weight:700;">＊</div>
  </div>

  <div id="sos-row" class="row gray-row">
    <div class="row-text">Emergency SOS</div>
    <div class="icon-circle">SOS</div>
  </div>

  <div id="cancel">
    <div id="cancel-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2">
        <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/>
      </svg>
    </div>
    <div id="cancel-text">Cancel</div>
  </div>
</div>

<div id="blackout"></div>

<script>
  const knob = document.getElementById('knob');
  const container = document.getElementById('power-row');
  const blackout = document.getElementById('blackout');
  const cancelBtn = document.getElementById('cancel-btn');

  const maxX = container.offsetWidth - knob.offsetWidth - 6;
  let dragging = false;
  let startX = 0;
  let currentX = 0;
  let done = false;

  function clientX(e) {
    return e.touches ? e.touches[0].clientX : e.clientX;
  }

  function onDown(e) {
    if (done) return;
    dragging = true;
    startX = clientX(e) - currentX;
    knob.style.cursor = 'grabbing';
  }

  function onMove(e) {
    if (!dragging || done) return;
    let x = clientX(e) - startX;
    x = Math.max(0, Math.min(maxX, x));
    currentX = x;
    knob.style.left = (3 + x) + 'px';

    if (x >= maxX - 2) {
      completeShutdown();
    }
  }

  function onUp() {
    if (!dragging || done) return;
    dragging = false;
    knob.style.cursor = 'grab';
    if (currentX < maxX - 2) {
      knob.style.transition = 'left 0.25s ease';
      knob.style.left = '3px';
      currentX = 0;
      setTimeout(() => { knob.style.transition = ''; }, 250);
    }
  }

  function completeShutdown() {
    if (done) return;
    done = true;
    knob.style.left = maxX + 3 + 'px';
    setTimeout(() => {
      blackout.style.pointerEvents = 'auto';
      blackout.style.opacity = '1';
    }, 150);
  }

  knob.addEventListener('mousedown', onDown);
  knob.addEventListener('touchstart', onDown, { passive: true });
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, { passive: true });
  window.addEventListener('mouseup', onUp);
  window.addEventListener('touchend', onUp);

  blackout.addEventListener('click', () => {
    blackout.style.opacity = '0';
    blackout.style.pointerEvents = 'none';
    done = false;
    currentX = 0;
    knob.style.left = '3px';
  });

  cancelBtn.addEventListener('click', () => {
    if (dragging || done) return;
    knob.style.transition = 'left 0.25s ease';
    knob.style.left = '3px';
    currentX = 0;
    setTimeout(() => { knob.style.transition = ''; }, 250);
  });
</script>

</body>
</html>
